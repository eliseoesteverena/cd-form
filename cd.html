<main class="container py-6">
    <h1 class="mb-6">Generar Carta Documento</h1>

    <div class="flex flex-col gap-6 mb-6">
        <!-- Sección Remitente -->
        <section class="border rounded-lg p-4">
            <h3 class="mb-4">Datos Remitente:</h3>

            <!-- 2 Columnas: Nombre y Dirección -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="form-group">
                    <label for="nombre_rt">Nombre:</label>
                    <input type="text" id="nombre_rt" placeholder="Nombre del Remitente" value="">
                </div>
                <div class="form-group">
                    <label for="domicilio_rt">Dirección:</label>
                    <input type="text" id="domicilio_rt" placeholder="Dirección del Remitente" value="">
                </div>
            </div>

            <!-- 3 Columnas: CP, Localidad y Provincia -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="form-group">
                    <label for="cp_rt">Código Postal:</label>
                    <input type="text" id="cp_rt" placeholder="Código Postal del Remitente" value="">
                </div>
                <div class="form-group">
                    <label for="localidad_rt">Localidad:</label>
                    <input type="text" id="localidad_rt" placeholder="Localidad del Remitente" value="">
                </div>
                <div class="form-group">
                    <label for="provincia_rt">Provincia:</label>
                    <input type="text" id="provincia_rt" placeholder="Provincia del Remitente" value="">
                </div>
            </div>
        </section>

        <!-- Sección Destinatario -->
        <section class="border rounded-lg p-4">
            <h3 class="mb-4">Datos Destinatario:</h3>

            <!-- 2 Columnas: Nombre y Dirección -->

                <div class="form-group">
                    <label for="nombre_dt">Nombre:</label>
                    <input type="text" id="nombre_dt" placeholder="Nombre del Destinatario" value="">
                </div>
                <div class="form-group">
                    <label for="domicilio_dt">Dirección:</label>
                    <input type="text" id="domicilio_dt" placeholder="Dirección del Destinatario" value="">
                </div>
            </div>

            <!-- 3 Columnas: CP, Localidad y Provincia -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
