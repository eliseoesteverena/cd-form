<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Generator with Quill Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Include Quill stylesheet -->
    <link href="css/quill.snow.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
     
    <!-- Include Quill and jsPDF -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header>
</header>
    <main class="container">
        <h1>Generar Carta Documento</h1>

        <div class="form-grid">
            <section>
                <h3>Información del Remitente</h3>
                <div class="grid">
                    <div class="form-group">
                        <label for="nombre_rt">Nombre:</label>
                        <input type="text" id="nombre_rt" placeholder="Nombre del Remitente">
                    </div>
                    <div class="form-group">
                        <label for="domicilio_rt">Dirección:</label>
                        <input type="text" id="domicilio_rt" placeholder="Dirección del Remitente">
                    </div>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label for="cp_rt">Código Postal:</label>
                        <input type="text" id="cp_rt" placeholder="Código Postal del Remitente">
                    </div>
                    <div class="form-group">
                        <label for="localidad_rt">Localidad:</label>
                        <input type="text" id="localidad_rt" placeholder="Localidad del Remitente">
                    </div>
                    <div class="form-group">
                        <label for="provincia_rt">Provincia:</label>
                        <input type="text" id="provincia_rt" placeholder="Provincia del Remitente">
                    </div>
                </div>
            </section>

            <section>
                <h3>Información del Destinatario</h3>
                <div class="grid">
                    <div class="form-group">
                        <label for="nombre_dt">Nombre:</label>
                        <input type="text" id="nombre_dt" placeholder="Nombre del Destinatario">
                    </div>
                    <div class="form-group">
                        <label for="domicilio_dt">Dirección:</label>
                        <input type="text" id="domicilio_dt" placeholder="Dirección del Destinatario">
                    </div>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label for="cp_dt">Código Postal:</label>
                        <input type="text" id="cp_dt" placeholder="Código Postal del Destinatario">
                    </div>
                    <div class="form-group">
                        <label for="localidad_dt">Localidad:</label>
                        <input type="text" id="localidad_dt" placeholder="Localidad del Destinatario">
                    </div>
                    <div class="form-group">
                        <label for="provincia_dt">Provincia:</label>
                        <input type="text" id="provincia_dt" placeholder="Provincia del Destinatario">
                    </div>
                </div>
            </section>
        </div>

        <h3>Contenido del Documento</h3>
        <div id="editor">Este es el contenido principal de su documento. Formátelo según sea necesario usando la barra de herramientas superior.</div>
       <div class="grid">
            <button class="outline" onclick="generatePDF('cd_correo_andreani')">CD para Andreani</button>
            <button class="primary" onclick="generatePDF('cd_correo_arg')">CD para Correo Argentino</button>
        </div> 
    </main>

   <script src="js/index.js"></script>
</body>
</html>
